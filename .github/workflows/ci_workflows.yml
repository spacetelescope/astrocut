name: CI

on:
  push:
    branches:
      - main
    tags:
      - "*"
  pull_request:
  schedule:
    # Nightly build triggered at 2 AM EST
    - cron: '0 7 * * *'

jobs:
  tests:
    name: PR Tests
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: PR Python 3.10 baseline
            os: ubuntu-latest
            python: "3.10"
            toxenv: py310-test

          - name: PR Python 3.11 baseline
            os: ubuntu-latest
            python: "3.11"
            toxenv: py311-test

          - name: PR Python 3.12 baseline
            os: ubuntu-latest
            python: "3.12"
            toxenv: py312-test

          - name: PR Python 3.13 baseline
            os: ubuntu-latest
            python: "3.13"
            toxenv: py313-test

          - name: PR Python 3.14 baseline
            os: ubuntu-latest
            python: "3.14"
            toxenv: py314-test

          - name: PR Python 3.14 on macOS
            os: macos-latest
            python: "3.14"
            toxenv: py314-test

          - name: PR Python 3.12 alldeps with coverage
            os: ubuntu-latest
            python: "3.12"
            toxenv: py312-test-alldeps-cov

          - name: PR code style checks
            os: ubuntu-latest
            python: "3.12"
            toxenv: codestyle

    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: ${{ matrix.python }}

      - name: Install language-pack-de and tzdata
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install language-pack-de tzdata

      - name: Install Python dependencies
        run: python -m pip install --upgrade tox

      - name: Run tests
        run: tox -e ${{ matrix.toxenv }}

      - name: Upload coverage to codecov
        if: ${{ contains(matrix.toxenv,'-cov') }}
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f  # v7.0.0
        with:
          files: ./coverage.xml
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  nightly_tests:
    if: github.event_name == 'schedule'
    name: Nightly Tests
    runs-on: ${{ matrix.os }}
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Nightly Python 3.10 baseline
            os: ubuntu-latest
            python: "3.10"
            toxenv: py310-test

          - name: Nightly Python 3.11 baseline
            os: ubuntu-latest
            python: "3.11"
            toxenv: py311-test

          - name: Nightly Python 3.12 baseline
            os: ubuntu-latest
            python: "3.12"
            toxenv: py312-test

          - name: Nightly Python 3.13 baseline
            os: ubuntu-latest
            python: "3.13"
            toxenv: py313-test

          - name: Nightly Python 3.14 baseline
            os: ubuntu-latest
            python: "3.14"
            toxenv: py314-test

          - name: Nightly Python 3.14 dev dependencies
            os: ubuntu-latest
            python: "3.14"
            toxenv: py314-test-devdeps

          - name: Nightly Python 3.14 all dependencies
            os: ubuntu-latest
            python: "3.14"
            toxenv: py314-test-alldeps

          - name: Nightly docs linkcheck
            os: ubuntu-latest
            python: "3.12"
            toxenv: linkcheck

          - name: Nighly Python 3.10 numpy 1.23 pin
            os: ubuntu-latest
            python: "3.10"
            toxenv: py310-test-numpy123

          - name: Nightly Python 3.12 astropy 5.2 pin
            os: ubuntu-latest
            python: "3.12"
            toxenv: py312-test-astropy52

    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: ${{ matrix.python }}

      - name: Install language-pack-de and tzdata
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install language-pack-de tzdata

      - name: Install Python dependencies
        run: python -m pip install --upgrade tox

      - name: Run tests
        run: tox -e ${{ matrix.toxenv }}
